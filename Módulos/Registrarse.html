<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Modulos css/Registrarse.css">
    <title>RECICLA</title>
</head>

<body>

    <header>
        <h1>RECICLA</h1>
    </header>
    <div class="registro"
        
        <form action="">
            <h2>Registrate </h2>

            <label for="">Nombre Completo: </label>
            <input type="text" id="nombre_completo" required placeholder="Ingrese el nombre completo">

            <br>
            
            <label for="">Grado: </label>
            <select id="Grado"></select>
            <option value="grado"></option>

            <label for="">Correo electronico: </label>
            <input type="email" id="correo_electronico" required placeholder="Ingrese su correo electronico">

            <br>

            <label for="">Contraseña: </label>
            <input type="password" id="contrasena" required placeholder="Ingrese su contraseña">

            <br>

            <label for="">Confirmar contraseña: </label>
            <input type="password" id="confirmar_contrasena" required placeholder="Confirme su contraseña">

            <br>

            <button type="submit">Guardar</button>
        </form>
    </div>

    <script src="../js/registrarse.js"></script>
</body>

</html>
